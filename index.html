function mensagem(texto,erro=false){const s=el('status');s.textContent=texto;s.className=erro?'erro':'sucesso';}
function atualizarEspeciais(){const sim=el('necessidade').value==='Sim';el('bloco-especiais').hidden=!sim;el('especiais').disabled=!sim||finalizado;el('especiais').required=sim;if(!sim&&!finalizado)el('especiais').value='';}
function dataFormatada(iso){if(!iso)return '';const [ano,mes,dia]=iso.split('-');return `${dia}/${mes}/${ano}`;}
function limparErros(){form.querySelectorAll('.invalido').forEach(e=>e.classList.remove('invalido'));form.querySelectorAll('.campo-erro').forEach(e=>e.remove());}
function marcarErro(campo,rotulo){const box=campo.closest('.field');box.classList.add('invalido');const aviso=document.createElement('small');aviso.className='campo-erro';aviso.textContent=`Preencha o campo ${rotulo}.`;box.append(aviso);}
function validar(){limparErros();const faltantes=[];for(const [rotulo,id] of campos){if(id==='especiais'&&el('necessidade').value!=='Sim')continue;const campo=el(id);if(!campo.value.trim()){faltantes.push(rotulo);marcarErro(campo,rotulo);}else if(!campo.checkValidity()){faltantes.push(rotulo);const box=campo.closest('.field');box.classList.add('invalido');const aviso=document.createElement('small');aviso.className='campo-erro';aviso.textContent=`Verifique o formato do campo ${rotulo}.`;box.append(aviso);}}return faltantes;}
function gerarTexto(){return ['POUSADA ALFORRIA - PRÉ-CHECK-IN','',...campos.map(([rotulo,id])=>`${rotulo}: ${id==='especiais'&&el('necessidade').value!=='Sim'?'':id==='nascimento'?dataFormatada(el(id).value):el(id).value.trim()}`)].join('\n');}
function travar(travado){finalizado=travado;form.querySelectorAll('input,select,textarea').forEach(e=>e.disabled=travado);el('corrigir').disabled=!travado;el('finalizar').disabled=travado;el('copiar').hidden=true;if(!travado)atualizarEspeciais();}
el('necessidade').addEventListener('change',atualizarEspeciais);
form.addEventListener('submit',e=>e.preventDefault());
el('finalizar').addEventListener('click',()=>{
 const faltantes=validar();
 if(faltantes.length){mensagem(`Não foi possível finalizar. ${faltantes.length===1?'Falta preencher o campo':'Faltam preencher os campos'}: ${faltantes.join(', ')}.`,true);el(campos.find(([rotulo])=>rotulo===faltantes[0])[1]).focus();return;}
 textoFinal=gerarTexto();travar(true);
 mensagem('Formulário finalizado! Aguarde 2 segundos para enviar pelo WhatsApp.');
 clearTimeout(temporizadorEnvio);
 temporizadorEnvio=setTimeout(()=>{
  if(!finalizado)return;
  el('copiar').hidden=false;
  mensagem('Clique em Enviar formulário. O WhatsApp abrirá com os dados preenchidos; basta confirmar o envio.');
 },2000);
});
el('corrigir').addEventListener('click',()=>{
 clearTimeout(temporizadorEnvio);temporizadorEnvio=null;
 travar(false);textoFinal='';limparErros();mensagem('Formulário liberado para correções. Finalize novamente após editar.');
});
el('copiar').addEventListener('click',()=>{
 if(!finalizado || el('copiar').hidden)return;
 const url='https://wa.me/5522992271509?text='+encodeURIComponent(textoFinal);
 mensagem('Abrindo WhatsApp com os dados preenchidos. Confira a mensagem e toque em Enviar.');
 window.location.assign(url);
});
form.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{const box=e.closest('.field');if(box){box.classList.remove('invalido');box.querySelectorAll('.campo-erro').forEach(x=>x.remove());}}));
travar(false);atualizarEspeciais();
})();</script></body></html>
